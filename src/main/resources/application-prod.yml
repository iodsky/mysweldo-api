spring:
  config:
    activate:
      on-profile: prod
  flyway:
    user: ${CLOUD_DB_USER}
    password: ${CLOUD_DB_PASSWORD}


  datasource:
    url: jdbc:postgresql://${CLOUD_DB_HOST}:${CLOUD_DB_PORT}/${CLOUD_DB}
    username: ${CLOUD_DB_USER}
    password: ${CLOUD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

aws:
  region: ${AWS_REGION}
  s3:
    bucket: ${S3_BUCKET}
