spring:
  config:
    activate:
      on-profile: prod
  flyway:
    user: ${CLOUD_DB_USER}
    password: ${CLOUD_DB_PASSWORD}


  datasource:
    url: jdbc:postgresql://${CLOUD_DB_HOST}:${CLOUD_DB_PORT}/${CLOUD_DB}
    username: ${CLOUD_DB_USER}
    password: ${CLOUD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

aws:
  access_key: ${AWS_ACCESS_KEY}
  secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION}
  s3:
    bucket: ${S3_BUCKET}

server:
  tomcat:
    threads:
      max: 20
